<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Planning Visites</title>
  <style>
    body {
      font-family: Segoe UI, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f3f2f1;
      color: #201f1e;
      text-align: center;
      padding: 20px;
    }

    p {
      max-width: 560px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    a {
      color: #0f6cbd;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div>
    <p>Chargement de l'application Planning Visites…</p>
    <p>Si l'application ne s'ouvre pas automatiquement, cliquez sur le lien ci-dessous :</p>
    <p><a id="fallbackLink" href="#" target="_blank">Ouvrir Power Apps</a></p>
  </div>
  <script>
    const powerAppsUrl =
      "https://apps.powerapps.com/play/e/415f9d61-b3be-418d-9421-869452d86e9b?source=iframe";

    document.getElementById("fallbackLink").href = powerAppsUrl;

    try {
      window.location.replace(powerAppsUrl);
    } catch (err) {
      console.warn("Redirection bloquée : ouverture du lien dans un nouvel onglet", err);
      window.open(powerAppsUrl, "_blank");
    }
  </script>
</body>
</html>
