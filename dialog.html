<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Planning Visites</title>
  <style>
    body {
      font-family: Segoe UI, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f3f2f1;
      color: #201f1e;
      text-align: center;
      padding: 0 20px;
    }

    p {
      max-width: 520px;
      line-height: 1.6;
    }

    a {
      color: #0f6cbd;
    }
  </style>
</head>
<body>
  <p>Ouverture du planning des visites…<br />Si rien ne se passe, cliquez sur le lien ci-dessous.</p>
  <p><a id="fallbackLink" href="#">Ouvrir l'application Power Apps</a></p>
  <script>
    const powerAppsUrl =
      "https://apps.powerapps.com/play/e/default-1142a072-6d78-4789-a846-e69a5abb61b4/a/415f9d61-b3be-418d-9421-869452d86e9b?tenantId=1142a072-6d78-4789-a846-e69a5abb61b4";

    document.getElementById("fallbackLink").href = powerAppsUrl;

    // redirection en dehors du contexte d'iframe ; replace évite l'historique inutile
    try {
      window.location.replace(powerAppsUrl);
    } catch (err) {
      console.warn("Redirection bloquée, ouverture en nouvelle fenêtre", err);
      window.open(powerAppsUrl, "_blank");
    }
  </script>
</body>
</html>
